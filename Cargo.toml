[package]
name = "ytui"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
innertube-rs = "0.9.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
mpris-server = { version = "0.10", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
ringbuf = "0.5.2"
rustfft = "6"
roxmltree = "0.20"
unicode-segmentation = "1"
